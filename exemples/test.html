<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Test du Débrouilleur BRV</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 14px system-ui, sans-serif; }
  header { padding: 10px 16px; }
  .player { position: relative; width: min(100vw, 1280px); aspect-ratio: 16 / 9; margin: 0 auto; background: #000; }
  .player video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  select { font: inherit; }
</style>
</head>
<body>
<header>
  Page de test locale de l'extension —
  <select id="file">
    <option>effets_sonores_brouille.mp4</option>
    <option>test720_brouille.mp4</option>
  </select>
  (servir ce dossier avec <code>python -m http.server 8000</code> puis ouvrir http://localhost:8000/test.html)
</header>
<div class="player"><video id="v" controls playsinline src="effets_sonores_brouille.mp4"></video></div>
<script>
  document.getElementById("file").addEventListener("change", (e) => {
    const v = document.getElementById("v"); v.src = e.target.value; v.play();
  });
</script>
</body>
</html>
